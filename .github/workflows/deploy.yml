name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest httpx
      - run: python -m pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Ship to the VPS and run the installer
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ vars.VPS_HOST || '200.234.34.123' }}
        run: |
          test -n "$SSH_KEY" || { echo "::error::Secret VPS_SSH_KEY is not set (repo Settings → Secrets and variables → Actions)"; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null 2> keyerr.txt; then
            echo "::error::VPS_SSH_KEY is not a valid private key — paste the whole block including the BEGIN and END lines. ($(tr '\n' ' ' < keyerr.txt))"
            exit 1
          fi
          echo "Key fingerprint: $(ssh-keygen -lf ~/.ssh/deploy_key)"
          # The key on the server is locked to /usr/local/bin/bankreco-deploy: it can only receive this tarball and run the installer.
          set +e
          tar czf - --exclude=.git --exclude=samples --exclude=tests --exclude=data . \
            | ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 \
                  -o IdentitiesOnly=yes root@"$VPS_HOST" deploy 2> ssherr.txt | tee sshout.txt
          rc=${PIPESTATUS[1]}
          set -e
          cat ssherr.txt
          if [ "$rc" != "0" ]; then
            echo "::error::Deploy over SSH failed (exit $rc): $(grep -v '^Warning: Permanently added' ssherr.txt | tail -4 | tr '\n' ' ') | Installer said: $(sed 's/\x1b\[[0-9;]*m//g' sshout.txt | grep -v '^\s*$' | tail -8 | tr '\n' ' ')"
            exit 1
          fi
      - name: Check the live site
        run: |
          for i in $(seq 1 18); do
            if curl -fsS https://kavitha.cloud/bankreco/healthz; then echo; echo "Live."; exit 0; fi
            sleep 10
          done
          echo "::error::Site did not answer on /bankreco/healthz within 3 minutes"; exit 1
