{% extends "base.html" %}
{% from "_brand.html" import lockup %}
{% block title %}Sign in · Bank Reco{% endblock %}
{% block auth %}
<div class="authwrap"><div class="authbox">
  <div class="org">{{ lockup('light', 'lg') }}</div>
  <div class="product">Bank Reconciliation</div>
  <h1>Sign in</h1>
  <p class="muted" style="margin-top:0">Bank reconciliation workspace</p>
  {% if flash %}<div class="flash {{ flash.kind }}">{{ flash.msg }}</div>{% endif %}
  <form method="post" action="{{ base }}/login">
    <input type="hidden" name="csrf_token" value="{{ csrf }}">
    <div class="field"><label for="u">Username</label><input id="u" type="text" name="username" autocomplete="username" required autofocus></div>
    <div class="field"><label for="p">Password</label><input id="p" type="password" name="password" autocomplete="current-password" required></div>
    <button class="btn primary" style="width:100%;justify-content:center">Sign in</button>
  </form>
</div></div>
{% endblock %}
